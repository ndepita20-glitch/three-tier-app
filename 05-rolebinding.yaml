apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-binding
  namespace: three-tier-app

subjects:
  - kind: ServiceAccount
    name: app-service-account
    namespace: three-tier-app

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-pod-reader