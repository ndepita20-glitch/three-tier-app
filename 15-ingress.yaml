apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: three-tier-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: pn-mankon.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-v1-service
            port:
              number: 80
      - path: /graduation-date
        pathType: Prefix
        backend:
          service:
            name: frontend-v1-service
            port:
              number: 80
      - path: /my-kids
        pathType: Prefix
        backend:
          service:
            name: frontend-v2-service
            port:
              number: 80
      - path: /phpmyadmin
        pathType: Prefix
        backend:
          service:
            name: phpmyadmin-service
            port:
              number: 80
  - host: www.pn-mankon.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-v1-service
            port:
              number: 80
      - path: /graduation-date
        pathType: Prefix
        backend:
          service:
            name: frontend-v1-service
            port:
              number: 80
      - path: /my-kids
        pathType: Prefix
        backend:
          service:
            name: frontend-v2-service
            port:
              number: 80
      - path: /phpmyadmin
        pathType: Prefix
        backend:
          service:
            name: phpmyadmin-service
            port:
              number: 80