apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: three-tier-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin/phpmyadmin:5.2.1-apache
        ports:
        - containerPort: 80
        env:
        - name: PMA_HOST
          value: mysql-service
        - name: MYSQL_ROOT_PASSWORD
          value: securepassword123
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin-service
  namespace: three-tier-app
spec:
  selector:
    app: phpmyadmin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP